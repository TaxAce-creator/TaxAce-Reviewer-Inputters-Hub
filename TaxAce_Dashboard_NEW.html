<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaxAce Reviewers Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --ink: #1a1a1a;
      --ink-soft: #666;
      --slate: #999;
      --line: #e0e0e0;
      --paper-raised: #fff;
      --blue: #2563eb;
      --blue-bg: #eff6ff;
      --blue-hover: #1d4ed8;
      --green: #16a34a;
      --green-bg: #dcfce7;
      --amber: #d97706;
      --amber-bg: #fef3c7;
      --red: #dc2626;
      --red-bg: #fee2e2;
      --page-bg: #f5f5f5;
      --photo-fallback-bg: #fafafa;
      --btn-secondary-hover: #777;
      --header-bar-bg: #1a1a1a;
      --header-bar-meta: rgba(255,255,255,0.7);
    }

    [data-theme="dark"] {
      --ink: #EDEBE5;
      --ink-soft: #B7B3A9;
      --slate: #8B887F;
      --line: #33383E;
      --paper-raised: #1E2227;
      --blue: #6D9BFF;
      --blue-bg: #16233B;
      --blue-hover: #5786F0;
      --green: #4CC98A;
      --green-bg: #14301F;
      --amber: #E0A94D;
      --amber-bg: #3A2E14;
      --red: #E27A7A;
      --red-bg: #3A1B1B;
      --page-bg: #14171B;
      --photo-fallback-bg: #262A30;
      --btn-secondary-hover: #999;
      --header-bar-bg: #0B0D0F;
      --header-bar-meta: rgba(255,255,255,0.65);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--page-bg);
      color: var(--ink);
      line-height: 1.6;
      transition: background-color .2s ease, color .2s ease;
    }

    .theme-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 16px; border-radius: 6px; border: 1px solid var(--line);
      background: var(--paper-raised); color: var(--ink);
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s ease;
    }
    .theme-toggle:hover { border-color: var(--ink-soft); background: var(--paper-raised); }

    .sheet-link-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 16px; border-radius: 6px; border: 1px solid var(--green);
      background: var(--green-bg); color: var(--green);
      font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer;
      transition: all .15s ease; white-space: nowrap;
    }
    .sheet-link-btn:hover { opacity: 0.85; }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 28px;
    }

    .title {
      font-size: 24px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 12px;
      color: var(--slate);
    }

    .header-right {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .status-badge {
      padding: 8px 12px;
      background: #dcfce7;
      color: #16a34a;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge::before {
      content: '●';
      font-size: 10px;
    }

    .record-count {
      font-size: 12px;
      color: var(--slate);
    }

    input[type="text"],
    select {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 14px;
    }

    input[type="text"] {
      width: 250px;
    }

    button {
      padding: 10px 20px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--blue-hover);
    }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--line);
      margin-bottom: 30px;
    }

    .tab {
      padding: 12px 20px;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-size: 14px;
      color: var(--slate);
      transition: all 0.2s;
    }

    .tab.active {
      color: var(--blue);
      border-bottom-color: var(--blue);
    }

    .tab:hover {
      color: var(--ink);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--slate);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--slate);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--paper-raised);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: var(--slate);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 600;
      color: var(--blue);
      margin-top: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--paper-raised);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    table th {
      background: var(--header-bar-bg);
      color: white;
      padding: 14px;
      text-align: left;
      font-weight: 600;
      font-size: 13px;
      border-bottom: 1px solid var(--line);
    }

    table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    table tr:hover {
      background: var(--blue-bg);
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-pending {
      background: var(--amber-bg);
      color: var(--amber);
    }

    .badge-uploaded {
      background: var(--green-bg);
      color: var(--green);
    }

    .badge-not-uploaded {
      background: var(--red-bg);
      color: var(--red);
    }

    .client-card {
      background: var(--paper-raised);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .client-card-header {
      background: var(--header-bar-bg);
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .client-card-title {
      font-weight: 600;
      font-size: 14px;
    }

    .client-card-meta {
      font-size: 12px;
      color: var(--header-bar-meta);
      margin-top: 4px;
    }

    .client-card-stats {
      display: flex;
      gap: 20px;
      font-size: 12px;
      color: white;
    }

    .documents-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .documents-list li {
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .documents-list li:first-child {
      border-top: none;
    }

    .doc-name {
      flex: 1;
      color: var(--ink);
      font-weight: 500;
    }

    .doc-status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      margin-left: auto;
    }

    .doc-status-uploaded {
      background: var(--green-bg);
      color: var(--green);
    }

    .doc-status-not-uploaded {
      background: var(--red-bg);
      color: var(--red);
    }

    .doc-status-pending {
      background: var(--amber-bg);
      color: var(--amber);
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .header-right {
        width: 100%;
        flex-direction: column;
        margin-top: 15px;
      }

      input[type="text"] {
        width: 100%;
      }

      table {
        font-size: 12px;
      }

      table th,
      table td {
        padding: 10px 12px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
    /* ---- Tax Term Reference (glossary) ---- */
    .glossary-toolbar {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px;
    }
    .glossary-toolbar input[type="text"] { flex: 1; min-width: 220px; width: auto; }
    .glossary-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .term-card {
      background: var(--paper-raised); border: 1px solid var(--line); border-radius: 8px;
      padding: 16px 18px 18px; overflow: hidden;
    }
    .term-card h3 {
      font-size: 15px; font-weight: 600; margin: 0 0 8px; color: var(--ink);
      border-bottom: 1px dotted var(--line); padding-bottom: 8px;
    }
    .term-card ul { margin: 0 0 10px; padding-left: 18px; font-size: 13px; color: var(--slate); line-height: 1.6; }
    .term-card img {
      width: 100%; max-height: 180px; object-fit: contain; border-radius: 6px;
      border: 1px solid var(--line); margin-top: 6px; background: var(--photo-fallback-bg);
      cursor: zoom-in; transition: opacity .15s ease;
    }
    .term-card img:hover { opacity: 0.85; }

    .lightbox-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.82);
      z-index: 1000; align-items: center; justify-content: center; padding: 40px;
      cursor: zoom-out;
    }
    .lightbox-overlay.open { display: flex; }
    .lightbox-overlay img {
      max-width: 90vw; max-height: 85vh; border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      cursor: default;
    }
    .lightbox-caption {
      position: absolute; bottom: 28px; left: 0; right: 0; text-align: center;
      color: #fff; font-size: 14px; font-weight: 600;
    }
    .lightbox-close {
      position: absolute; top: 20px; right: 28px; color: #fff; font-size: 32px;
      font-weight: 300; cursor: pointer; line-height: 1; background: none; border: none;
      padding: 4px 10px;
    }
    .lightbox-close:hover { color: #ccc; background: none; }

    .save-toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: white; padding: 12px 20px; border-radius: 8px;
      font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none;
      transition: opacity .2s ease, transform .2s ease; z-index: 2000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .save-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .save-toast.error { background: var(--red); }
    .add-term-form {
      display: none; background: var(--paper-raised); border: 1px solid var(--line);
      border-radius: 8px; padding: 18px 20px; margin-bottom: 20px;
    }
    .add-term-form label {
      display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--slate); margin-bottom: 6px; margin-top: 14px;
    }
    .add-term-form label:first-child { margin-top: 0; }
    .add-term-form input[type="text"], .add-term-form textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px;
    }
    .add-term-form textarea { resize: vertical; min-height: 80px; font-family: inherit; }
    .photo-preview { margin-top: 10px; max-width: 240px; max-height: 160px; border-radius: 6px; border: 1px solid var(--line); display: none; }
    .add-term-actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn-secondary { background: var(--slate); }
    .btn-secondary:hover { background: var(--btn-secondary-hover); }
    .term-photo-actions { display: flex; gap: 8px; margin-top: 10px; }
    .photo-btn, .photo-remove-btn {
      padding: 6px 10px; font-size: 12px; font-weight: 500; border-radius: 5px; cursor: pointer;
      border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink-soft);
      transition: all .15s ease;
    }
    .photo-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--paper-raised); }
    .photo-remove-btn:hover { border-color: var(--red); color: var(--red); background: var(--paper-raised); }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <div class="header">
      <div class="header-left">
        <div class="logo">📊</div>
        <div>
          <div class="title">TaxAce Reviewers Dashboard</div>
          <div class="subtitle">Consolidated Real-Time Data View | All Tabs Integrated</div>
        </div>
      </div>
      <div class="header-right">
        <div class="status-badge" id="connectionStatus">
          Connected • <span id="recordCount">0</span> records
        </div>
        <input type="text" id="searchInput" placeholder="Search client...">
        <select id="reviewerFilter">
          <option value="">All Reviewers</option>
          <option value="Annalyn">Annalyn</option>
          <option value="Jessel">Jessel</option>
          <option value="Lyndon">Lyndon</option>
          <option value="Dani">Dani</option>
        </select>
        <button onclick="refreshData()">🔄 Refresh</button>
        <a href="https://docs.google.com/spreadsheets/d/1C5DzuHvKfursdBp_KVZ_4af2Ym7Oef7BAlQ8kqx5OGg/edit?gid=2126218207#gid=2126218207" target="_blank" rel="noopener" class="sheet-link-btn">📊 Open Spreadsheet</a>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙 Dark</button>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab(event, 'overview')">📋 Overview</button>
      <button class="tab" onclick="switchTab(event, 'document-status')">📄 Document Status</button>
      <button class="tab" onclick="switchTab(event, 'all-clients')">👥 All Clients</button>
      <button class="tab" onclick="switchTab(event, 'by-reviewer')">👨‍💼 By Reviewer</button>
      <button class="tab" onclick="switchTab(event, 'pending')">⏳ Pending</button>
      <button class="tab" onclick="switchTab(event, 'completed')">✅ Completed</button>
      <button class="tab" onclick="switchTab(event, 'glossary')">📖 Tax Term Reference</button>
    </div>

    <!-- TAB 1: OVERVIEW -->
    <div id="overview" class="tab-content active">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Records</div>
          <div class="stat-value" id="totalRecords">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Unique Clients</div>
          <div class="stat-value" id="uniqueClients">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">With Reviewer</div>
          <div class="stat-value" id="withReviewer">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Pending Docs</div>
          <div class="stat-value" id="totalPending">0</div>
        </div>
      </div>

      <h3 style="margin-top: 28px; margin-bottom: 16px;">Recent Clients</h3>
      <div id="overviewTable"></div>
    </div>

    <!-- TAB 2: DOCUMENT STATUS -->
    <div id="document-status" class="tab-content">
      <div id="documentStatusContent"></div>
    </div>

    <!-- TAB 3: ALL CLIENTS -->
    <div id="all-clients" class="tab-content">
      <div id="allClientsContent"></div>
    </div>

    <!-- TAB 4: BY REVIEWER -->
    <div id="by-reviewer" class="tab-content">
      <div id="byReviewerContent"></div>
    </div>

    <!-- TAB 5: PENDING -->
    <div id="pending" class="tab-content">
      <div id="pendingContent"></div>
    </div>

    <!-- TAB 6: COMPLETED -->
    <div id="completed" class="tab-content">
      <div id="completedContent"></div>
    </div>

    <!-- TAB 7: TAX TERM REFERENCE -->
    <div id="glossary" class="tab-content">
      <div class="glossary-toolbar">
        <input type="text" id="glossarySearch" placeholder="Search a term (e.g. 1099-NEC, Solo 401k, alimony)...">
        <button onclick="toggleAddTermForm()">+ Add Term</button>
      </div>

      <div class="add-term-form" id="addTermForm">
        <label>Term</label>
        <input type="text" id="newTermName" placeholder="e.g. Backdoor Roth IRA">

        <label>Details (one point per line)</label>
        <textarea id="newTermDetails" placeholder="One bullet point per line..."></textarea>

        <label>Photo (optional — what it looks like)</label>
        <input type="file" id="newTermPhoto" accept="image/*">
        <img id="photoPreview" class="photo-preview">

        <div class="add-term-actions">
          <button onclick="saveNewTerm()">Save Term</button>
          <button class="btn-secondary" onclick="cancelAddTerm()">Cancel</button>
        </div>
      </div>

      <input type="file" id="termPhotoInput" accept="image/*" style="display:none;">
      <div class="glossary-grid" id="glossaryGrid"></div>
    </div>
  </div>

  <div class="lightbox-overlay" id="lightboxOverlay">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <script>
    // ========== CONFIGURATION ==========
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzvV70L8pvG3j2s-DL46nsbKQ_BrEYBDd9pDZ5bASwgjWHCdLWQHdV3-3IEUaBtVymIGg/exec';
    let allData = [];
    let filteredData = [];

    // ========== INITIALIZE ==========
    document.addEventListener('DOMContentLoaded', function() {
      refreshData();
      document.getElementById('searchInput').addEventListener('keyup', filterData);
      document.getElementById('reviewerFilter').addEventListener('change', filterData);
    });

    // ========== FETCH DATA ==========
    function refreshData() {
      const btn = document.querySelector('button[onclick="refreshData()"]');
      const originalText = btn ? btn.textContent : '';
      if(btn){ btn.textContent = '🔄 Refreshing...'; btn.disabled = true; }

      fetch(APPS_SCRIPT_URL)
        .then(response => response.json())
        .then(data => {
          allData = data.data || [];
          filteredData = [...allData];
          const count = data.count || 0;
          document.getElementById('recordCount').textContent = count;
          renderAllTabs();
          showSaveToast('✓ Refreshed — ' + count + ' records', false);
        })
        .catch(error => {
          console.error('Error:', error);
          document.getElementById('recordCount').textContent = '0';
          showSaveToast('⚠ Refresh failed — check your connection', true);
        })
        .finally(() => {
          if(btn){ btn.textContent = originalText; btn.disabled = false; }
        });
    }

    // ========== FILTER DATA ==========
    function filterData() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const reviewer = document.getElementById('reviewerFilter').value;

      filteredData = allData.filter(record => {
        const matchesSearch = !searchTerm || record.clientName.toLowerCase().includes(searchTerm);
        const matchesReviewer = !reviewer || record.reviewerTab === reviewer;
        return matchesSearch && matchesReviewer;
      });

      renderAllTabs();
    }

    // ========== TAB SWITCHING ==========
    function switchTab(event, tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tabName).classList.add('active');
    }

    // ========== RENDER TABS ==========
    function renderAllTabs() {
      renderOverview();
      renderDocumentStatus();
      renderAllClients();
      renderByReviewer();
      renderPending();
      renderCompleted();
    }

    function renderOverview() {
      const stats = {
        total: filteredData.length,
        unique: new Set(filteredData.map(r => r.clientName)).size,
        withReviewer: filteredData.filter(r => r.reviewerTab).length,
        pending: filteredData.reduce((sum, r) => sum + (r.pendingDocumentCount || 0), 0)
      };

      document.getElementById('totalRecords').textContent = stats.total;
      document.getElementById('uniqueClients').textContent = stats.unique;
      document.getElementById('withReviewer').textContent = stats.withReviewer;
      document.getElementById('totalPending').textContent = stats.pending;

      let html = '<table><thead><tr><th>Client Name</th><th>Task Name</th><th>Subtask Status</th><th>Reviewer</th><th>Pending Docs</th><th>Tax Year</th></tr></thead><tbody>';
      
      filteredData.slice(0, 10).forEach(r => {
        html += `<tr>
          <td><strong>${r.clientName}</strong></td>
          <td>${r.taskName}</td>
          <td>${r.subtaskStatus}</td>
          <td>${r.reviewerTab || '-'}</td>
          <td><span class="badge ${r.pendingDocumentCount > 0 ? 'badge-pending' : 'badge-uploaded'}">${r.pendingDocumentCount || 0}</span></td>
          <td>${r.taskTaxYear}</td>
        </tr>`;
      });
      
      html += '</tbody></table>';
      document.getElementById('overviewTable').innerHTML = html;
    }

    function renderDocumentStatus() {
      const clientMap = new Map();
      filteredData.forEach(record => {
        if (!clientMap.has(record.clientName)) {
          clientMap.set(record.clientName, record);
        }
      });

      let html = '';
      clientMap.forEach((record, clientName) => {
        const pending = record.pendingDocumentCount || 0;
        html += `
          <div class="client-card">
            <div class="client-card-header">
              <div>
                <div class="client-card-title">${clientName}</div>
                <div class="client-card-meta">Status: <strong>${record.subtaskStatus}</strong> | Preparer: <strong>${record.reviewerTab || '-'}</strong></div>
              </div>
              <div class="client-card-stats">
                <span>Total: ${record.documentCount || 0} docs | Pending: ${pending}</span>
              </div>
            </div>
            <div class="client-card-body">
              <ul class="documents-list">
        `;
        
        if (record.documents && record.documents.length > 0) {
          record.documents.forEach(doc => {
            const docStatus = doc.status || 'Pending';
            let statusClass = 'doc-status-pending';
            let statusText = 'Pending';

    let glossarySearchTerm = '';

    async function loadGlossaryState(){
      try{
        const raw = localStorage.getItem('taxace-dashboard-glossary');
        if(raw){
          const parsed = JSON.parse(raw);
          if(Array.isArray(parsed) && parsed.length) GLOSSARY_TERMS = parsed;
        }
      }catch(e){ console.error('Could not load saved glossary', e); }
    }
    async function saveGlossaryState(){
      const payload = JSON.stringify(GLOSSARY_TERMS);
      try{
        localStorage.setItem('taxace-dashboard-glossary', payload);
        // Read it back immediately — some private-browsing modes let setItem()
        // succeed silently without actually persisting anything, so don't trust
        // a lack of a thrown error as proof the save worked.
        const verify = localStorage.getItem('taxace-dashboard-glossary');
        if(verify !== payload){
          throw new Error('Saved data did not verify on read-back — your browser may be blocking storage (private/incognito mode, or a file:// page opened directly instead of a hosted URL).');
        }
        showSaveToast('✓ Saved', false);
      }catch(e){
        console.error('Could not save glossary', e);
        showSaveToast('⚠ Not actually saved — ' + (e.message.includes('quota') ? 'storage is full' : 'check if private/incognito mode is blocking storage'), true);
      }
    }

    // ---- Save confirmation toast ----
    function showSaveToast(message, isError){
      let toast = document.getElementById('saveToast');
      if(!toast){
        toast = document.createElement('div');
        toast.id = 'saveToast';
        document.body.appendChild(toast);
      }
      toast.textContent = message;
      toast.className = 'save-toast' + (isError ? ' error' : '') + ' show';
      clearTimeout(toast._hideTimer);
      toast._hideTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2600);
    }

    function renderGlossary(filter){
      const f = (filter || '').trim().toLowerCase();
      const terms = GLOSSARY_TERMS.filter(function(g){
        if(!f) return true;
        const hay = (g.term + ' ' + g.details.join(' ')).toLowerCase();
        return hay.includes(f);
      });
      const grid = document.getElementById('glossaryGrid');
      if(!terms.length){
        grid.innerHTML = '<div class="empty-state">No glossary terms match "' + escapeHtmlG(filter) + '".</div>';
        return;
      }
      grid.innerHTML = terms.map(function(g){
        const idx = GLOSSARY_TERMS.indexOf(g);
        const photoHtml = g.photo ? ('<img src="' + g.photo + '" alt="' + escapeHtmlG(g.term) + '">') : '';
        const photoActions = g.photo
          ? '<button class="photo-btn" data-idx="' + idx + '">🔄 Change Photo</button><button class="photo-remove-btn" data-idx="' + idx + '">✕ Remove</button>'
          : '<button class="photo-btn" data-idx="' + idx + '">📷 Add Photo</button>';
        return '<div class="term-card"><h3>' + escapeHtmlG(g.term) + '</h3><ul>' +
          g.details.map(function(d){ return '<li>' + escapeHtmlG(d) + '</li>'; }).join('') +
          '</ul>' + photoHtml + '<div class="term-photo-actions">' + photoActions + '</div></div>';
      }).join('');
    }
    function escapeHtmlG(s){
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
      });
    }

    // Resize/compress the uploaded photo client-side before storing, so a handful
    // of term photos don't blow past the per-key storage size limit.
    function handlePhotoUpload(file){
      return new Promise(function(resolve){
        const reader = new FileReader();
        reader.onload = function(e){
          const img = new Image();
          img.onload = function(){
            const maxWidth = 480;
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('newTermPhoto').addEventListener('change', async function(e){
      const file = e.target.files[0];
      if(!file) return;
      pendingPhotoDataUrl = await handlePhotoUpload(file);
      const preview = document.getElementById('photoPreview');
      preview.src = pendingPhotoDataUrl;
      preview.style.display = 'block';
    });

    async function saveNewTerm(){
      const name = document.getElementById('newTermName').value.trim();
      const detailsRaw = document.getElementById('newTermDetails').value;
      const details = detailsRaw.split(String.fromCharCode(10)).map(function(s){ return s.trim(); }).filter(Boolean);
      if(!name){ alert('Give the term a name first.'); return; }
      const newTerm = { term: name, details: details };
      if(pendingPhotoDataUrl) newTerm.photo = pendingPhotoDataUrl;
      GLOSSARY_TERMS = [newTerm].concat(GLOSSARY_TERMS);
      await saveGlossaryState();
      cancelAddTerm();
      // Clear any leftover search filter so the newly-added term is guaranteed
      // to be visible immediately, instead of silently hidden by a stale search.
      glossarySearchTerm = '';
      document.getElementById('glossarySearch').value = '';
      renderGlossary('');
    }

    document.getElementById('glossarySearch').addEventListener('input', function(e){
      glossarySearchTerm = e.target.value;
      renderGlossary(glossarySearchTerm);
    });

    (async function initGlossary(){
      await loadGlossaryState();
      renderGlossary('');
    })();

    // ========== THEME TOGGLE ==========
    // Uses the SAME localStorage key as the Reviewer Hub (index.html), so opening
    // this tool from the hub carries over whichever theme was last set, and — since
    // localStorage is shared across tabs on the same origin — toggling in one tab
    // updates the other live via the 'storage' event below.
    let inMemoryTheme = 'light';
    function getSavedTheme(){
      try{ return localStorage.getItem('taxace-hub-theme') || inMemoryTheme; }
      catch(e){ return inMemoryTheme; }
    }
    function saveTheme(theme){
      inMemoryTheme = theme;
      try{ localStorage.setItem('taxace-hub-theme', theme); }catch(e){ /* session-only fallback */ }
    }
    function applyTheme(theme){
      document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
      const btn = document.getElementById('themeToggle');
      if(btn) btn.textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
    }
    function toggleTheme(){
      const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      saveTheme(next);
    }
    window.addEventListener('storage', function(e){
      if(e.key === 'taxace-hub-theme' && e.newValue){ applyTheme(e.newValue); }
    });
    applyTheme(getSavedTheme());
  </script>
</body>
</html>
